name: MommaBees Website Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bakery source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript and security basics
        run: npm test
      - name: Check all frontend and backend JavaScript syntax
        run: |
          find site functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
